apiVersion: v1
kind: ConfigMap
metadata:
  name: juvre-demo-cim
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    STANDARDS = [
      {"key":"greendigit-commons","label":"GreenDIGIT Commons","profile":"Autumn School demonstration profile","version":"Demo profile 2026.1","description":"A demonstrative vocabulary profile connecting notebook runs, measurements and provenance for the GreenDIGIT training workflow.","compliance":"Demonstration guidance only. This is not an authoritative or certified GreenDIGIT specification."},
      {"key":"saref4energy","label":"SAREF4Energy","profile":"Energy domain extension","version":"ETSI TS 103 410-1","description":"SAREF extension for the energy domain.","compliance":"Vocabulary mapping preview; no conformance assessment is performed."},
      {"key":"saref4environment","label":"SAREF4Environment","profile":"Environment domain extension","version":"ETSI TS 103 410-7","description":"SAREF extension for environmental observations and properties.","compliance":"Vocabulary mapping preview; no conformance assessment is performed."},
      {"key":"saref4bldg","label":"SAREF4BLDG","profile":"Building domain extension","version":"ETSI TS 103 410-3","description":"SAREF extension for building devices and building spaces.","compliance":"Vocabulary mapping preview; no conformance assessment is performed."},
      {"key":"iec-cim","label":"IEC CIM","profile":"Common Information Model","version":"IEC 61968 / IEC 61970 family","description":"Common Information Model concepts for electric power systems.","compliance":"Family reference only; no IEC profile validation is performed."}
    ]
    METADATA_PROFILES = [
      {"key":"default","label":"GreenDIGIT Cloud detailed","ri_type":"cloud","profile_version":"2026.1","description":"Detailed experiment provenance with metric counts, units and value ranges.","experiment_term":"schema:Dataset","metric_term":"sosa:Observation","metric_summary_name":"JuVRE metric summary","include_metric_extrema":True},
      {"key":"compact-energy","label":"GreenDIGIT Cloud compact","ri_type":"cloud","profile_version":"2026.1-compact","description":"A mock alternative that emits a compact metric inventory and energy-oriented mappings.","experiment_term":"schema:CreativeWork","metric_term":"schema:PropertyValue","metric_summary_name":"JuVRE energy metric inventory","include_metric_extrema":False}
    ]
    FIELD_REGISTRY = [
      {"source":"configured publication group","eimps_target":"group","definition":"Authorised server-side metric publication group.","canonical_unit":None,"value_type":"string","required":True,"transformation":"verbatim configured value","measurement_boundary":"publication authorization","provenance_requirements":"explicit user or deployment configuration","standards_mapping":{"reference":"GreenDIGIT WP6 submission contract","status":"exact"}},
      {"source":"configured site identifier","eimps_target":"SiteName","definition":"Registered identifier of the site executing the notebook.","canonical_unit":None,"value_type":"string","required":True,"transformation":"verbatim configured value","measurement_boundary":"execution site","provenance_requirements":"explicit selected-site configuration","standards_mapping":{"reference":"GreenDIGIT WP6 Cloud schema","status":"exact"}},
      {"source":"configured infrastructure type","eimps_target":"CloudType","definition":"Actual underlying cloud technology.","canonical_unit":None,"value_type":"string","required":True,"transformation":"verbatim configured value","measurement_boundary":"execution infrastructure","provenance_requirements":"explicit deployment configuration","standards_mapping":{"reference":"GreenDIGIT WP6 Cloud schema","status":"exact"}},
      {"source":"configured compute service","eimps_target":"CloudComputeService","definition":"Identifier of the cloud compute service.","canonical_unit":None,"value_type":"string","required":True,"transformation":"verbatim configured value","measurement_boundary":"execution service","provenance_requirements":"explicit deployment configuration","standards_mapping":{"reference":"GreenDIGIT WP6 Cloud schema","status":"exact"}},
      {"source":"run.id","eimps_target":"ExecUnitID","definition":"Stable identifier of the tracked execution unit.","canonical_unit":None,"value_type":"string","required":True,"transformation":"verbatim stable run identifier","measurement_boundary":"notebook run","provenance_requirements":"run.json id","standards_mapping":{"reference":"GreenDIGIT WP6 Cloud schema","status":"exact"}},
      {"source":"run start/end timestamps","eimps_target":"StartExecTime, EndExecTime, WallClockTime_s","definition":"UTC execution window and rounded elapsed wall-clock seconds.","canonical_unit":"seconds","value_type":"datetime|string, datetime|string, integer","required":True,"transformation":"UTC ISO 8601; elapsed seconds rounded half up","measurement_boundary":"tracked run lifecycle","provenance_requirements":"run.json start_time and end_time","standards_mapping":{"reference":"GreenDIGIT WP6 Cloud schema","status":"exact"}},
      {"source":"run.status","eimps_target":"Status, ExecUnitFinished","definition":"Faithful execution status and integer terminal-state marker.","canonical_unit":None,"value_type":"string, integer","required":True,"transformation":"JuVRE status mapping; terminal status to 1, otherwise 0","measurement_boundary":"tracked run lifecycle","provenance_requirements":"run.json status","standards_mapping":{"reference":"GreenDIGIT WP6 Cloud schema","status":"exact"}},
      {"source":"configured VO/workload owner","eimps_target":"Owner","definition":"VO or workload-owner dimension, never a personal username guess.","canonical_unit":None,"value_type":"string","required":True,"transformation":"verbatim configured value","measurement_boundary":"workload ownership","provenance_requirements":"explicit user or deployment configuration","standards_mapping":{"reference":"GreenDIGIT WP6 Cloud schema","status":"exact"}},
      {"source":"attributable energy_j or Scaphandre process energy/power","eimps_target":"EnergyWh","definition":"Energy attributable to this notebook run.","canonical_unit":"Wh","value_type":"float","required":True,"transformation":"J/3600, microjoule delta/3.6e9, or time-integrated microwatts/3.6e9","measurement_boundary":"run-attributed process or execution unit only","provenance_requirements":"explicit run attribution in metric labels; host totals are rejected","standards_mapping":{"reference":"GreenDIGIT energy extension","status":"GreenDIGIT extension"}},
      {"source":"evidenced workload accounting metrics","eimps_target":"Work, Efficiency, CpuDuration_s, SuspendDuration_s, CPUNormalizationFactor","definition":"Optional workload accounting values.","canonical_unit":"field-specific","value_type":"float or integer","required":False,"transformation":"verbatim supported evidence only","measurement_boundary":"workload accounting","provenance_requirements":"defined source metric and unit","standards_mapping":{"reference":"GreenDIGIT KPI inputs","status":"input-to-KPI"}}
    ]
    class Handler(BaseHTTPRequestHandler):
      def do_GET(self):
        if self.path not in ("/", "/v1/standards"):
          self.send_error(404); return
        body = json.dumps({"service":"JuVRE Autumn School CIM demonstration","mode":"demo","authenticated":True,"identity":"gd-super-user","identity_note":"Simulated EGI Check-in identity; no real account was verified.","standards":STANDARDS,"default_standard":"greendigit-commons","metadata_profiles":METADATA_PROFILES,"default_metadata_profile":"default","cloud_profile":{"ri_type":"cloud","registry_version":"greendigit-wp6-cloud-2026.1","field_registry":FIELD_REGISTRY}}).encode()
        self.send_response(200); self.send_header("Content-Type", "application/json")
        self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juvre-demo-cim
spec:
  replicas: 1
  selector:
    matchLabels: { app: juvre-demo-cim }
  template:
    metadata:
      labels: { app: juvre-demo-cim }
    spec:
      containers:
        - name: cim-demo
          image: python:3.12-alpine
          command: [python, /app/server.py]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            {
              httpGet: { path: /v1/standards, port: http },
              initialDelaySeconds: 1,
              periodSeconds: 5
            }
          volumeMounts: [{ name: app, mountPath: /app }]
      volumes: [{ name: app, configMap: { name: juvre-demo-cim } }]
---
apiVersion: v1
kind: Service
metadata:
  name: juvre-demo-cim
spec:
  selector: { app: juvre-demo-cim }
  ports: [{ name: http, port: 8080, targetPort: http }]
