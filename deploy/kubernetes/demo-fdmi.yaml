apiVersion: v1
kind: ConfigMap
metadata:
  name: juvre-demo-fdmi
data:
  server.py: |
    import hashlib
    import json
    from pathlib import Path
    from http.server import BaseHTTPRequestHandler, HTTPServer

    store = Path("/data/submissions.json")
    submissions = json.loads(store.read_text()) if store.is_file() else {}
    class Handler(BaseHTTPRequestHandler):
      def do_GET(self):
        if self.path != "/healthz": self.send_error(404); return
        self.send_response(204); self.end_headers()
      def do_POST(self):
        if self.path != "/v1/submissions": self.send_error(404); return
        try:
          length = int(self.headers.get("Content-Length", "0"))
          payload = json.loads(self.rfile.read(length))
          key = payload["idempotency_key"]
          if not payload.get("experiment_id") or not payload.get("ro_crate_metadata"):
            raise ValueError("experiment_id and ro_crate_metadata are required")
          existing = submissions.get(key)
          receipt = existing["receipt"] if existing else "FDMI-DEMO-" + key[:16].upper()
          if not existing:
            versions = [item["version"] for item in submissions.values() if item["experiment_id"] == payload["experiment_id"]]
            submissions[key] = {"receipt":receipt,"experiment_id":payload["experiment_id"],"version":max(versions, default=0)+1,"artifact_sha256":payload["artifact_sha256"]}
            store.parent.mkdir(parents=True, exist_ok=True)
            temporary = store.with_suffix(".tmp"); temporary.write_text(json.dumps(submissions)); temporary.replace(store)
          body = json.dumps({"accepted": True, "receipt": receipt, "idempotency_key": key, "version": submissions[key]["version"], "message": "Accepted by the persistent Autumn School mock FDMI target."}).encode()
          self.send_response(200); self.send_header("Content-Type", "application/json")
          self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
        except (KeyError, ValueError, json.JSONDecodeError) as error:
          self.send_error(400, str(error))
    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juvre-demo-fdmi
spec:
  replicas: 1
  selector:
    matchLabels: { app: juvre-demo-fdmi }
  template:
    metadata:
      labels: { app: juvre-demo-fdmi }
    spec:
      containers:
        - name: fdmi-demo
          image: python:3.12-alpine
          command: [python, /app/server.py]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            {
              httpGet: { path: /healthz, port: http },
              initialDelaySeconds: 1,
              periodSeconds: 5
            }
          volumeMounts:
            - { name: app, mountPath: /app }
            - { name: data, mountPath: /data }
      volumes:
        - { name: app, configMap: { name: juvre-demo-fdmi } }
        - { name: data, persistentVolumeClaim: { claimName: juvre-demo-fdmi-data } }
---
apiVersion: v1
kind: Service
metadata:
  name: juvre-demo-fdmi
spec:
  selector: { app: juvre-demo-fdmi }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: juvre-demo-fdmi-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
