apiVersion: v1
kind: ConfigMap
metadata:
  name: juvre-mock-federation
data:
  server.py: |
    import hashlib, json
    from http.server import BaseHTTPRequestHandler, HTTPServer
    class Handler(BaseHTTPRequestHandler):
      def do_GET(self):
        if self.path != "/healthz": self.send_error(404); return
        self.send_response(204); self.end_headers()
      def do_POST(self):
        try:
          payload = json.loads(self.rfile.read(int(self.headers.get("Content-Length", "0"))))
          if self.path == "/v1/catalogue":
            if payload.get("vo") != "GD-AS-DEMO" or not payload.get("experiment", {}).get("id"):
              raise ValueError("GD-AS-DEMO and experiment are required")
            key = payload["user_key"] + ":" + payload["experiment"]["id"]
            catalogue_id = "GD-AS-DEMO-" + hashlib.sha256(key.encode()).hexdigest()[:16].upper()
            body = json.dumps({"accepted": True, "catalogue_id": catalogue_id}).encode()
            self.send_response(200); self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body); return
          if self.path != "/v1/register": self.send_error(404); return
          if payload.get("vo") != "GD-AS-DEMO" or not payload.get("user"):
            raise ValueError("GD-AS-DEMO and user are required")
          membership = "GD-AS-DEMO-" + hashlib.sha256(payload["user"].encode()).hexdigest()[:10].upper()
          body = json.dumps({"accepted": True, "membership_id": membership}).encode()
          self.send_response(200); self.send_header("Content-Type", "application/json")
          self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
        except (ValueError, json.JSONDecodeError) as error: self.send_error(400, str(error))
    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juvre-mock-federation
spec:
  replicas: 1
  selector:
    matchLabels: { app: juvre-mock-federation }
  template:
    metadata:
      labels: { app: juvre-mock-federation }
    spec:
      containers:
        - name: mock-federation
          image: python:3.12-alpine
          command: [python, /app/server.py]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            {
              httpGet: { path: /healthz, port: http },
              initialDelaySeconds: 1,
              periodSeconds: 5
            }
          volumeMounts: [{ name: app, mountPath: /app }]
      volumes: [{ name: app, configMap: { name: juvre-mock-federation } }]
---
apiVersion: v1
kind: Service
metadata:
  name: juvre-mock-federation
spec:
  selector: { app: juvre-mock-federation }
  ports: [{ name: http, port: 8080, targetPort: http }]
